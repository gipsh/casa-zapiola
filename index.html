<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa Zapiola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: la maqueta ocupa toda la pantalla; las herramientas flotan como rótulos de plano (caja + celda numerada) */
:root{
  --paper:#f1f2ef; --paper-2:#e5e7e2; --ink:#1c2226; --muted:#5b6469; --line:#c7ccc6;
  --accent:#2443c4; --accent-ink:#ffffff; --scrim:rgba(241,242,239,.9);
  --shadow:0 1px 0 rgba(0,0,0,.04),0 10px 34px rgba(18,26,32,.16);
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15191c; --paper-2:#20262a; --ink:#e5e8e5; --muted:#9aa3a7; --line:#323a3f;
  --accent:#8fa3ff; --accent-ink:#0c1122; --scrim:rgba(21,25,28,.9);
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 34px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#15191c; --paper-2:#20262a; --ink:#e5e8e5; --muted:#9aa3a7; --line:#323a3f;
  --accent:#8fa3ff; --accent-ink:#0c1122; --scrim:rgba(21,25,28,.9);
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 34px rgba(0,0,0,.45); color-scheme:dark}

html,body{height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:13px;font-stretch:92%}
#stage{position:fixed;inset:0;background:linear-gradient(#9fc0dd,#e6ecef);transition:background .6s}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-stretch:100%}
.cap{text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--muted)}

/* ── top-left: rótulo del plano ── */
#top{position:fixed;left:16px;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;max-width:min(430px,calc(100vw - 32px));pointer-events:none}
#top>*{pointer-events:auto}
.tag{display:inline-grid;grid-template-columns:auto 1fr;border:1.5px solid var(--ink);background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tag>b{font-family:var(--f-mono);font-weight:500;padding:6px 9px;border-right:1.5px solid var(--ink);display:flex;align-items:center}
.tag>span{padding:6px 11px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.tag .t1{font-weight:650;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px}
.tag .t2{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-stretch:100%}
#brand .t1{font-size:15px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px 10px;border-radius:999px;display:inline-flex;gap:7px;align-items:center;font-weight:550}
.chip:hover{border-color:var(--ink)}
.chip kbd{font-family:var(--f-mono);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.on kbd{color:inherit;border-color:currentColor;opacity:.7}
#mood{background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;width:250px}
#mood .lbl{font-size:11.5px}
#mood .bar{height:4px;background:var(--paper-2);border-radius:2px;overflow:hidden}
#mood .bar i{display:block;height:100%;background:var(--ink);transition:width .5s}
#mood .bar.win i{background:var(--accent)}
#mood .pc{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:right;min-width:3ch}
#moodHead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline}
#moodHead strong{font-size:12px}

/* ── panel derecho ── */
#panel{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));width:340px;background:var(--scrim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
#tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
#tabs button{background:none;border:0;padding:11px 6px 10px;font-weight:600;letter-spacing:.04em;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
#tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:14px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.pane[hidden]{display:none}
.sec{display:flex;flex-direction:column;gap:8px}
.sec h3{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.hint{color:var(--muted);line-height:1.45;margin:0}
.sw-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.sw{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:0;display:flex;flex-direction:column;overflow:hidden;text-align:left;touch-action:pan-y}
.sw .img{aspect-ratio:1/1;background-size:cover;background-position:center;max-width:100%}
.sw .nm{font-size:10.5px;line-height:1.2;padding:4px 5px 5px;min-height:2.5em}
.sw:hover{border-color:var(--ink)}
.sw.cur{outline:2px solid var(--accent);outline-offset:1px}
.sel-card{border:1.5px solid var(--ink);display:grid;grid-template-columns:auto 1fr;background:var(--paper)}
.sel-card>b{font-family:var(--f-mono);font-weight:500;padding:8px 10px;border-right:1.5px solid var(--ink);display:flex;align-items:center}
.sel-card>div{padding:7px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sel-card .t1{font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.sel-card .t2{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.sel-card .acts{grid-column:1/-1;border-top:1px solid var(--line);display:flex;flex-wrap:wrap}
.sel-card .acts button{flex:1 1 auto;background:none;border:0;border-right:1px solid var(--line);padding:8px 6px;font-size:12px;font-weight:550;white-space:nowrap}
.sel-card .acts button:last-child{border-right:0}
.sel-card .acts button:hover{background:var(--paper-2)}
.sel-card .acts .danger{color:#b4331f}
.list{display:flex;flex-direction:column}
.room{border-top:1px solid var(--line);padding:8px 0 4px}
.room:first-child{border-top:0;padding-top:0}
.room .rh{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
.room .rh .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);min-width:1.2em}
.room .rh .rn{font-weight:650;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px}
.srow{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;background:none;border:0;padding:5px 4px;border-radius:4px;text-align:left;width:100%}
.srow:hover{background:var(--paper-2)}
.srow.cur{background:var(--paper-2);box-shadow:inset 2px 0 0 var(--accent)}
.srow .dot{width:18px;height:18px;border-radius:3px;border:1px solid var(--line);background-size:cover}
.srow .k{color:var(--muted);font-size:12px}
.srow .v{font-size:12px;text-align:right}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:4px 4px 6px;display:flex;flex-direction:column;gap:2px;align-items:stretch;touch-action:pan-y}
.cat:hover{border-color:var(--ink)}
.cat img{width:100%;aspect-ratio:4/3;object-fit:contain;background:var(--paper-2);border-radius:2px;max-width:100%}
.cat .nm{font-size:11px;font-weight:550;text-align:center;line-height:1.2}
.cat .dm{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);text-align:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 12px;border-radius:4px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.field{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:8px 10px;min-width:0;flex:1}
textarea.field{font-family:var(--f-mono);font-size:11px;min-height:70px;resize:vertical;width:100%;box-sizing:border-box}
.var-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.var{border:1px solid var(--line);border-radius:4px;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;position:relative}
.var button.load{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column}
.var img{width:100%;aspect-ratio:16/10;object-fit:cover;background:var(--paper-2);max-width:100%}
.var .nm{padding:5px 7px 0;font-weight:600;font-size:12px}
.var .dt{padding:0 7px 6px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.var .del{position:absolute;top:4px;right:4px;border:0;background:var(--scrim);border-radius:3px;width:22px;height:22px;line-height:1;font-size:14px}

/* ── dock inferior: sol + vistas ── */
#dock{position:fixed;left:16px;right:372px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--scrim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;padding:10px 14px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 11px;font-weight:600;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
#timeBox{flex:1 1 260px;display:flex;flex-direction:column;gap:3px;min-width:200px}
#timeTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#timeNow{font-family:var(--f-mono);font-size:17px;font-weight:500}
#sunInfo{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);text-align:right}
#timeTrack{position:relative;height:22px}
#time{width:100%;margin:0;position:absolute;inset:0;accent-color:var(--accent)}
#dayband{position:absolute;left:8px;right:8px;top:9px;height:4px;border-radius:2px;background:var(--paper-2);pointer-events:none}
#dayband i{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#e7a45b,#f2d59a 25%,#f7e9c4 50%,#f2d59a 75%,#e7a45b);border-radius:2px}
.ctl{display:flex;flex-direction:column;gap:3px}
.ctl select,.ctl input[type=range]{accent-color:var(--accent)}
.ctl select{border:1px solid var(--line);background:var(--paper);border-radius:4px;padding:5px 6px}
#orientRow{display:flex;align-items:center;gap:8px}
#compass{width:30px;height:30px;flex:none}
#orient{width:110px}
.tog{display:flex;flex-direction:column;gap:5px}
.tog label{display:flex;gap:6px;align-items:center;font-size:12px;white-space:nowrap}
.tog input{accent-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:4px;font-weight:550;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
#toast.on{opacity:1}
#ghost{position:fixed;width:46px;height:46px;border:2px solid var(--paper);box-shadow:0 4px 18px rgba(0,0,0,.35);border-radius:4px;pointer-events:none;z-index:50;background-size:cover;transform:translate(-50%,-50%)}
#walkHelp{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--scrim);border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:12px}
#joy{position:fixed;left:24px;bottom:calc(150px + env(safe-area-inset-bottom,0px));width:110px;height:110px;border-radius:50%;border:1.5px solid var(--line);background:var(--scrim);touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:var(--ink);opacity:.7}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:100;font-family:var(--f-mono);color:var(--muted);transition:opacity .4s}
#sheetBtn{display:none}

@media (max-width: 820px){
  #top{max-width:calc(100vw - 32px)}
  #mood{display:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;border-radius:10px 10px 0 0;max-height:46vh;padding-bottom:env(safe-area-inset-bottom,0px);transition:max-height .25s}
  #panel.min{max-height:calc(46px + env(safe-area-inset-bottom,0px))}
  #panel.min .pane{display:none}
  #sheetBtn{display:block;position:absolute;right:6px;top:6px;border:0;background:none;padding:6px 10px;font-size:16px}
  #tabs{padding-right:40px}
  #dock{left:8px;right:8px;bottom:calc(46vh + 8px);gap:10px;padding:8px 10px}
  body.sheet-min #dock{bottom:calc(54px + env(safe-area-inset-bottom,0px))}
  #dock .hide-sm{display:none}
  #toast{bottom:calc(46vh + 120px)}
  #joy{bottom:calc(46vh + 110px)}
  body.sheet-min #joy{bottom:calc(150px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div id="stage"><canvas id="c" tabindex="0" aria-label="Maqueta 3D de la planta baja"></canvas></div>
<div id="loading">Levantando paredes…</div>

<div id="top">
  <div class="tag" id="brand"><b>PB</b><span><span class="t1">Casa Zapiola</span><span class="t2">planta baja · esc. 1:50 · +0.24</span></span></div>
  <div class="row" id="presets" role="group" aria-label="Climas">
    <button class="chip" data-p="calido">Cálido <kbd>1</kbd></button>
    <button class="chip" data-p="luminoso">Luminoso <kbd>2</kbd></button>
    <button class="chip" data-p="profundo">Profundo <kbd>3</kbd></button>
  </div>
  <div id="mood" aria-live="polite">
    <div id="moodHead"><span class="cap">Cómo se siente</span><strong id="moodWord">—</strong></div>
    <span class="lbl">Cálido</span><span class="bar" id="mb0"><i></i></span><span class="pc" id="mp0"></span>
    <span class="lbl">Luminoso</span><span class="bar" id="mb1"><i></i></span><span class="pc" id="mp1"></span>
    <span class="lbl">Profundo</span><span class="bar" id="mb2"><i></i></span><span class="pc" id="mp2"></span>
  </div>
</div>

<aside id="panel">
  <div id="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="sup" id="tab-sup">Superficies</button>
    <button role="tab" aria-selected="false" data-tab="mue" id="tab-mue">Muebles</button>
    <button role="tab" aria-selected="false" data-tab="var" id="tab-var">Variantes</button>
  </div>
  <button id="sheetBtn" aria-label="Mostrar u ocultar panel">▾</button>
  <div class="pane" id="pane-sup" role="tabpanel"></div>
  <div class="pane" id="pane-mue" role="tabpanel" hidden></div>
  <div class="pane" id="pane-var" role="tabpanel" hidden></div>
</aside>

<div id="dock">
  <div class="seg" role="group" aria-label="Vista">
    <button data-view="orbit" aria-pressed="true">3D</button>
    <button data-view="plan" aria-pressed="false">Planta</button>
    <button data-view="walk" aria-pressed="false">Recorrer</button>
  </div>
  <div id="timeBox">
    <div id="timeTop"><span id="timeNow">18:30</span><span id="sunInfo"></span></div>
    <div id="timeTrack"><div id="dayband"><i></i></div><input id="time" type="range" min="5" max="23" step="0.0833" value="18.5" aria-label="Hora del día"></div>
  </div>
  <div class="ctl hide-sm"><span class="cap">Fecha</span><select id="month" aria-label="Fecha"></select></div>
  <div class="ctl hide-sm"><span class="cap" id="orientLbl">Frente hacia</span>
    <div id="orientRow"><svg id="compass" viewBox="-15 -15 30 30" aria-hidden="true"><circle r="13.5" fill="none" stroke="currentColor" stroke-opacity=".35"/><g id="needle"><path d="M0 -12 L4 0 L0 -2 L-4 0Z" fill="currentColor"/><path d="M0 12 L4 0 L0 2 L-4 0Z" fill="currentColor" fill-opacity=".3"/></g></svg>
    <input id="orient" type="range" min="0" max="345" step="15" value="45" aria-label="Orientación del frente"></div></div>
  <div class="tog hide-sm">
    <label><input type="checkbox" id="cut"> Paredes bajas</label>
    <label><input type="checkbox" id="labels" checked> Rótulos</label>
  </div>
</div>

<div id="toast" role="status"></div>
<div id="walkHelp" hidden>Arrastrá para mirar · <span class="mono">W A S D</span> para caminar · <span class="mono">Esc</span> sale</div>
<div id="joy" hidden><i></i></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LAT=-34.57, LON=-58.45, TZ=-3;         // Buenos Aires
const FL=0.24, TOP=2.94, CUT=1.25;           // piso living +0.24, cielorraso a 2.70 libres
const CX=4.73, CZ=4.95;                        // centro del lote

/* ═════════ utilidades ═════════ */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}
function shade(h,f,a){const[r,g,b]=hex(h);const t=f<0?0:255,p=Math.min(1,Math.abs(f));return `rgba(${Math.round(r+(t-r)*p)},${Math.round(g+(t-g)*p)},${Math.round(b+(t-b)*p)},${a==null?1:a})`}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sstep=(a,b,v)=>{const t=clamp((v-a)/(b-a),0,1);return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
function pip(x,z,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,zi]=poly[i],[xj,zj]=poly[j];if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/(zj-zi)+xi))c=!c}return c}
function fmtT(h){h=((h%24)+24)%24;const H=Math.floor(h),M=Math.round((h-H)*60);return (M===60?H+1:H)+':'+String(M===60?0:M).padStart(2,'0')}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1800)}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ═════════ ambientes (medidas del plano, en metros; origen = esquina interior fondo-izquierda) ═════════ */
const ROOMS={
  living:  {n:'1',name:'Living / comedor',lvl:.24, tag:[1.35,3.32], poly:[[0,3.0],[5.76,3.0],[5.76,4.45],[5.73,4.45],[5.73,5.92],[4.1,5.92],[4.1,9.60],[1.31,9.48],[1.31,7.66],[0,7.66]]},
  cocina:  {n:'2',name:'Cocina',lvl:.24, tag:[5.02,6.25], poly:[[4.1,5.92],[5.73,5.92],[5.73,4.45],[6.34,4.45],[6.34,9.68],[4.1,9.60]]},

    const fz=h.object.userData&&h.object.userData.faceZones;if(fz){const mi=h.face&&h.face.materialIndex!=null?h.face.materialIndex:0;const z=fz[mi]!=null?fz[mi]:fz[0];if(z)return{kind:'zone',zone:z,point:h.point}}
    if(h.object.material===M.glass)continue;}return null}
function planeHit(e,y){setRay(e);const p=new THREE.Vector3();return ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-y),p)?p:null}

let down=null,drag=null,sunDrag=false,look=null;
function onDown(e){if(e.button===2||e.button===1)return;canvas.focus({preventScroll:true});
  const h=pick(e);down={x:e.clientX,y:e.clientY,hit:h,moved:false};
  if(h&&h.kind==='sun'&&mode!=='walk'){sunDrag=true;stopOrbit(e)}
  else if(h&&h.kind==='item'){const it=ITEMS_STATE.find(x=>x.uid===h.uid);selectItem(h.uid);const lv=levelAt(it.x,it.z);const p=planeHit(e,lv)||h.point;drag={it,ox:it.x-p.x,oz:it.z-p.z,lv,sx:it.x,sz:it.z,moved:false};canvas.style.cursor='grabbing';stopOrbit(e)}
  else if(mode==='walk'){look={x:e.clientX,y:e.clientY};stopOrbit(e)}
  canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId)}
function stopOrbit(e){controls.enabled=false;e.stopImmediatePropagation()}
function tryMove(it,nx,nz){const snap=v=>Math.round(v*20)/20;const cands=[[snap(nx),snap(nz)],[nx,nz]];for(const[x,z]of cands)if(!collides(it,x,z,it.rot)){it.x=x;it.z=z;return true}
  // deslizar sobre un eje y acercarse al contacto
  const px=it.x,pz=it.z;if(!collides(it,nx,pz,it.rot)){it.x=nx;return true}if(!collides(it,px,nz,it.rot)){it.z=nz;return true}
  let lo=0,hi=1;for(let i=0;i<7;i++){const m=(lo+hi)/2;if(collides(it,px+(nx-px)*m,pz+(nz-pz)*m,it.rot))hi=m;else lo=m}it.x=px+(nx-px)*lo;it.z=pz+(nz-pz)*lo;return lo>0}
window.addEventListener('pointermove',e=>{
  if(swDrag){moveSwatchDrag(e);return}
  if(spawn){moveSpawn(e);return}
  if(down&&!down.moved&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>5)down.moved=true;
  if(drag){const p=planeHit(e,drag.lv);if(p){tryMove(drag.it,p.x+drag.ox,p.z+drag.oz);placeItem(drag.it);drag.moved=true}return}
  if(sunDrag){let best=null,bd=1e9;const r=canvas.getBoundingClientRect();for(const a of arcPts){const v=a.v.clone().project(camera);const sx=(v.x+1)/2*r.width+r.left,sy=(1-v.y)/2*r.height+r.top;const d=(sx-e.clientX)**2+(sy-e.clientY)**2;if(d<bd){bd=d;best=a}}if(best){state.time=best.h;updateSun()}return}
  if(look){walk.yaw-=(e.clientX-look.x)*.004;walk.pitch=clamp(walk.pitch-(e.clientY-look.y)*.004,-1.2,1.2);look={x:e.clientX,y:e.clientY};return}
  if(e.target===canvas&&!down){const h=pick(e,{});canvas.style.cursor=h?(h.kind==='item'?'grab':'pointer'):(mode==='walk'?'grab':'')}});
window.addEventListener('pointerup',e=>{
  if(swDrag){endSwatchDrag(e);return}
  if(spawn){endSpawn(e);return}
  if(drag){if(drag.moved)commit();drag=null;canvas.style.cursor='grab'}
  else if(sunDrag){sunDrag=false}
  else if(down&&!down.moved&&e.target===canvas){const h=down.hit;if(h&&h.kind==='zone')selectZone(h.zone);else if(!h||h.kind!=='item')deselect()}
  look=null;down=null;if(mode!=='walk')controls.enabled=true});
window.addEventListener('pointercancel',()=>{if(swDrag){if(swDrag.ghost)swDrag.ghost.remove();if(swDrag.preview)previewOff(swDrag.preview);swDrag=null}if(spawn){if(spawn.it)commit();spawn=null}if(drag){if(drag.moved)commit();drag=null}sunDrag=false;look=null;down=null;if(mode!=='walk')controls.enabled=true});
function onWheel(e){if(drag){e.preventDefault();e.stopImmediatePropagation();rotateSel(e.deltaY>0?15:-15,true)}}
function rotateSel(deg,noCommit){if(!sel||sel.type!=='item')return;const it=ITEMS_STATE.find(x=>x.uid===sel.uid);if(!it)return;const nr=it.rot+deg*Math.PI/180;
  if(collides(it,it.x,it.z,nr)){const[x,z]=freeSpotRot(it,nr);if(x==null){toast('No entra girado ahí');return}it.x=x;it.z=z}it.rot=nr;placeItem(it);if(!noCommit)commit()}
function freeSpotRot(it,r){for(let d=.05;d<1.2;d+=.05)for(let a=0;a<Math.PI*2;a+=Math.PI/8){const x=it.x+Math.cos(a)*d,z=it.z+Math.sin(a)*d;if(!collides(it,x,z,r))return[x,z]}return[null,null]}
function removeSel(){if(!sel||sel.type!=='item')return;removeItem(sel.uid);deselect();commit();toast('Mueble quitado')}
function dupSel(){if(!sel||sel.type!=='item')return;const it=ITEMS_STATE.find(x=>x.uid===sel.uid);const n={type:it.type,x:it.x,z:it.z,rot:it.rot,mats:Object.assign({},it.mats)};const[x,z]=freeSpot(n,it.x+.3,it.z+.3);n.x=x;n.z=z;addItem(n);selectItem(n.uid);commit()}

/* arrastrar muestras de material a la maqueta */
let swDrag=null;
function startSwatchDrag(e,matId){e.preventDefault();swDrag={id:matId,x:e.clientX,y:e.clientY,moved:false,preview:null,ghost:null}}
function targetFor(h,matId){if(!h)return null;const cat=MAT[matId].cat;
  if(h.kind==='zone'&&zoneCat(h.zone)===cat)return{zone:h.zone};
  if(h.kind==='item'){const it=ITEMS_STATE.find(x=>x.uid===h.uid);const T=ITEMS[it.type];if(cat==='tela'&&T.slots.tela)return{uid:it.uid,slot:'tela'};if(cat==='acabado'&&T.slots.madera)return{uid:it.uid,slot:'madera'}}return null}
function previewOn(t,id){if(t.zone)applyDef(ZM[t.zone],id,'world');else applyDef(IOBJ[t.uid].mats[t.slot],id,'item')}
function previewOff(t){if(t.zone)applyDef(ZM[t.zone],ZDEF[t.zone],'world');else{const it=ITEMS_STATE.find(x=>x.uid===t.uid);if(it)applyDef(IOBJ[t.uid].mats[t.slot],it.mats[t.slot],'item')}}
function sameT(a,b){return a&&b&&a.zone===b.zone&&a.uid===b.uid&&a.slot===b.slot}
function moveSwatchDrag(e){const s=swDrag;if(!s.moved&&Math.hypot(e.clientX-s.x,e.clientY-s.y)>6){s.moved=true;const g=document.createElement('div');g.id='ghost';g.setAttribute('style',swatchCSS(s.id));document.body.appendChild(g);s.ghost=g}
  if(!s.moved)return;s.ghost.style.left=e.clientX+'px';s.ghost.style.top=e.clientY+'px';
  const over=document.elementFromPoint(e.clientX,e.clientY)===canvas;const t=over?targetFor(pick(e,{noSun:true}),s.id):null;
  if(!sameT(t,s.preview)){if(s.preview)previewOff(s.preview);if(t)previewOn(t,s.id);s.preview=t}}
function endSwatchDrag(e){const s=swDrag;swDrag=null;if(s.ghost)s.ghost.remove();
  if(!s.moved){applyToSel(s.id);return}
  if(s.preview){const t=s.preview;if(t.zone){setZone(t.zone,s.id);selectZone(t.zone)}else{setItemMat(t.uid,t.slot,s.id);selectItem(t.uid)}}
  else toast('Soltalo sobre una superficie compatible')}
function setZone(z,id){ZDEF[z]=id;applyDef(zoneMat(z),id,'world');const r=z.split(':')[1];if(z.startsWith('piso:')&&LABELS[r])drawTag(r);commit()}
function setItemMat(uid,slot,id){const it=ITEMS_STATE.find(x=>x.uid===uid);if(!it)return;it.mats[slot]=id;applyDef(IOBJ[uid].mats[slot],id,'item');commit()}
function applyToSel(id){const cat=MAT[id].cat;
  if(sel&&sel.type==='zone'&&zoneCat(sel.zone)===cat){setZone(sel.zone,id);renderSup();return}
  if(sel&&sel.type==='item'){const slot=cat==='tela'?'tela':cat==='acabado'?'madera':null;const it=ITEMS_STATE.find(x=>x.uid===sel.uid);if(slot&&ITEMS[it.type].slots[slot]){setItemMat(sel.uid,slot,id);renderMue();return}}
  toast('Primero tocá una superficie en la maqueta')}

/* agregar muebles desde el catálogo (tocar o arrastrar) */
let spawn=null;
function startSpawn(e,type){e.preventDefault();spawn={type,x:e.clientX,y:e.clientY,moved:false,it:null}}
function moveSpawn(e){const s=spawn;if(!s.moved&&Math.hypot(e.clientX-s.x,e.clientY-s.y)>8)s.moved=true;if(!s.moved)return;
  const over=document.elementFromPoint(e.clientX,e.clientY)===canvas;
  if(over){const p=planeHit(e,FL);if(!p)return;if(!s.it){const it={type:s.type,x:p.x,z:p.z,rot:0};const[x,z]=freeSpot(it,p.x,p.z);it.x=x;it.z=z;addItem(it);s.it=it;selectItem(it.uid)}else{tryMove(s.it,p.x,p.z);placeItem(s.it)}}}
function endSpawn(e){const s=spawn;spawn=null;if(s.it){commit();return}if(s.moved)return;
  // toque simple: aparece en un lugar libre cerca del centro de la vista
  const r=canvas.getBoundingClientRect();const p=planeHit({clientX:r.left+r.width*.45,clientY:r.top+r.height*.5},FL)||new THREE.Vector3(2,0,5);
  const it={type:s.type,x:clamp(p.x,.3,9),z:clamp(p.z,.3,9.3),rot:0};const[x,z]=freeSpot(it,it.x,it.z);it.x=x;it.z=z;addItem(it);selectItem(it.uid);commit();toast(ITEMS[s.type].name+' agregado · arrastralo para ubicarlo')}

let mode='orbit';let tween=null;const walk={x:.6,z:8.9,yaw:0,pitch:-.05,keys:{},joy:[0,0]};
function flyTo(pos,tgt,fov){tween={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:pos,t1:tgt,f0:camera.fov,f1:fov||38}}
function setView(v){if(mode==='walk'&&v!=='walk')exitWalk();mode=v;$$('.seg [data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===v)));
  if(v==='orbit'){controls.enabled=true;flyTo(new THREE.Vector3(CX+9.5,13,CZ+14),new THREE.Vector3(CX,.6,CZ))}
  if(v==='plan'){controls.enabled=true;flyTo(new THREE.Vector3(CX,26,CZ+.02),new THREE.Vector3(CX,0,CZ),34)}
  if(v==='walk')enterWalk();
  G.labels.visible=state.labels&&v!=='walk';G.sky.visible=v!=='walk';applyCut()}

function walkBlocked(x,z){const P=obb(x,z,.17,.17,0,'solid');for(const c of COLL)if(sat(P,c))return true;for(const it of ITEMS_STATE){const T=ITEMS[it.type];if(T.tag==='rug'||T.tag==='pend')continue;if(sat(P,itemOBB(it)))return true}return x<0||x>9.46||z<0||z>9.75}

const THUMBS={};

// dock
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
(function(){const s=$('#month');let h=`<option value="today">Hoy · ${now.getDate()} ${MES[now.getMonth()]}</option>`;[[11,21,'Verano · 21 dic'],[2,21,'Otoño · 21 mar'],[5,21,'Invierno · 21 jun'],[8,21,'Primavera · 21 sep']].forEach(([m,d,l])=>h+=`<option value="${m}-${d}">${l}</option>`);MES.forEach((m,i)=>h+=`<option value="${i}-15">15 ${m}</option>`);s.innerHTML=h})();
$('#month').addEventListener('change',e=>{const v=e.target.value;if(v==='today'){state.month=now.getMonth();state.day=now.getDate()}else{const[m,d]=v.split('-').map(Number);state.month=m;state.day=d}buildArc();updateSun();syncSunUI()});
$('#time').addEventListener('input',e=>{state.time=+e.target.value;updateSun()});
$('#orient').addEventListener('input',e=>{state.front=+e.target.value;buildArc();updateSun();syncSunUI()});
$('#cut').addEventListener('change',e=>{state.cut=e.target.checked;applyCut()});
$('#labels').addEventListener('change',e=>{state.labels=e.target.checked;G.labels.visible=state.labels&&mode!=='walk'});
$$('.seg [data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
$$('#presets .chip').forEach(b=>b.addEventListener('click',()=>applyPreset(b.dataset.p)));
const CARD=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
function syncSunUI(){$('#orient').value=state.front;$('#orientLbl').textContent='Frente hacia '+CARD[Math.round(state.front/22.5)%16]+' · '+state.front+'°';$('#needle').setAttribute('transform',`rotate(${-state.front})`);
  const{rise,set}=sunTimes();$('#sunInfo').textContent=rise?`sale ${fmtT(rise)} · se pone ${fmtT(set)}`:'';
  const mn=5,mx=23;const band=$('#dayband i');if(rise){band.style.left=((rise-mn)/(mx-mn)*100)+'%';band.style.width=((set-rise)/(mx-mn)*100)+'%'}}

// teclado
window.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;const k=e.key;
  if((e.metaKey||e.ctrlKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();return}
  if(mode==='walk'){walk.keys[k.toLowerCase()]=true;if(k==='Escape')setView('orbit');if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k.toLowerCase()))e.preventDefault();}
  if(k==='1')applyPreset('calido');if(k==='2')applyPreset('luminoso');if(k==='3')applyPreset('profundo');
  if(k==='['){state.time=clamp(state.time-.25,5,23);updateSun()}if(k===']'){state.time=clamp(state.time+.25,5,23);updateSun()}
  if(k===','){rotateSel(-15);renderMue()}if(k==='.'){rotateSel(15);renderMue()}
  if((k==='Delete'||k==='Backspace')&&sel&&sel.type==='item'){e.preventDefault();removeSel()}
  if(k==='Escape'&&mode!=='walk')deselect();
  if(mode!=='walk'&&(k==='r'||k==='R'))setView(mode==='plan'?'plan':'orbit');
  if(mode!=='walk'&&(k==='c'||k==='C')){state.cut=!state.cut;$('#cut').checked=state.cut;applyCut()}});
window.addEventListener('keyup',e=>{walk.keys[e.key.toLowerCase()]=false});
// joystick táctil
(function(){const j=$('#joy'),k=j.querySelector('i');let on=false;const set=e=>{const r=j.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const m=Math.hypot(x,y);if(m>1){x/=m;y/=m}walk.joy=[x,y];k.style.transform=`translate(${x*32}px,${y*32}px)`};
  j.addEventListener('pointerdown',e=>{on=true;j.setPointerCapture(e.pointerId);set(e);e.stopPropagation()});j.addEventListener('pointermove',e=>{if(on)set(e)});j.addEventListener('pointerup',()=>{on=false;walk.joy=[0,0];k.style.transform=''})})();

/* ═════════ miniaturas del catálogo ═════════ */
function makeThumbs(){let tr;try{tr=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true})}catch(e){return}tr.setSize(160,120);tr.outputEncoding=THREE.sRGBEncoding;tr.toneMapping=THREE.ACESFilmicToneMapping;
  const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x8a8070,1.0));const dl=new THREE.DirectionalLight(0xffffff,1.1);dl.position.set(3,5,4);sc.add(dl);const cam=new THREE.PerspectiveCamera(30,4/3,.05,50);
  for(const k in ITEMS){const T=ITEMS[k];const it={type:k,mats:Object.assign({},T.slots)};const o=makeItemObj(it);sc.add(o.group);
    const box=new THREE.Box3().setFromObject(o.group);const c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3());const r=Math.max(s.x,s.y*1.2,s.z)*1.0;
    cam.position.set(c.x+r*1.25,c.y+r*.95,c.z+r*1.7);cam.lookAt(c);tr.render(sc,cam);THUMBS[k]=tr.domElement.toDataURL('image/png');sc.remove(o.group);disposeObj(o.group)}
  tr.dispose();try{tr.forceContextLoss()}catch(e){}}

/* ═════════ loop ═════════ */
function resize(){const w=window.innerWidth,h=window.innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
window.addEventListener('resize',resize);
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(tween){tween.t=Math.min(1,tween.t+dt/.9);const e=1-Math.pow(1-tween.t,3);camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);camera.fov=lerp(tween.f0,tween.f1,e);camera.updateProjectionMatrix();if(tween.t>=1)tween=null}
  if(mode==='walk'){const K=walk.keys;let f=(K.w||K.arrowup?1:0)-(K.s||K.arrowdown?1:0)-walk.joy[1],s=(K.d?1:0)-(K.a?1:0)+walk.joy[0];if(K.arrowleft)walk.yaw+=dt*1.6;if(K.arrowright)walk.yaw-=dt*1.6;if(K.q)walk.yaw+=dt*1.6;if(K.e)walk.yaw-=dt*1.6;
    const sp=1.5*dt,fx=-Math.sin(walk.yaw),fz=-Math.cos(walk.yaw),rx=-fz,rz=fx;const nx=walk.x+(fx*f+rx*s)*sp,nz=walk.z+(fz*f+rz*s)*sp;
    if(!walkBlocked(nx,walk.z))walk.x=nx;if(!walkBlocked(walk.x,nz))walk.z=nz;
    const eye=levelAt(walk.x,walk.z)+1.55;camera.position.set(walk.x,eye,walk.z);const d=new THREE.Vector3(-Math.sin(walk.yaw)*Math.cos(walk.pitch),Math.sin(walk.pitch),-Math.cos(walk.yaw)*Math.cos(walk.pitch));camera.lookAt(camera.position.clone().add(d))}
  else controls.update();
  // pulso de selección
  if(sel&&sel.type==='zone'&&ZM[sel.zone]){const k=.1+.08*Math.sin(t/260);ZM[sel.zone].emissive.copy(accent).multiplyScalar(k)}
  if(outline)outline.material.opacity=.65+.35*Math.sin(t/220);
  renderer.render(scene,camera);requestAnimationFrame(frame)}

/* ═════════ arranque ═════════ */
function init(){readAccent();matchMedia('(prefers-color-scheme: dark)').addEventListener&&matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{readAccent();updateOutline()});
  buildFloors();buildWalls();buildFixtures();buildShadowCasters();buildLamps();buildLabels();
  scene.traverse(o=>{if(o.isMesh&&o.material===M.glass){o.castShadow=false}});
  DEFAULT_ITEMS.forEach(it=>addItem(JSON.parse(JSON.stringify(it))));
  resize();syncSunUI();buildArc();updateMood.ready=true;updateSun();applyCut();
  try{makeThumbs()}catch(e){}
  renderSup();renderMue();commit();
  if(isNarrow())toggleSheet(true);
  requestAnimationFrame(frame);
  const L=$('#loading');L.style.opacity=0;setTimeout(()=>L.remove(),450);
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{for(const k in LABELS)drawTag(k)});
  window.__casa={state,serialize,ITEMS_STATE,COLL,collides,setView,applyPreset,SUN}}
if(!window.THREE||!THREE.OrbitControls){$('#loading').textContent='No se pudo cargar el motor 3D. Revisá la conexión y recargá.'}else{try{init()}catch(err){console.error(err);$('#loading').textContent='Error al armar la maqueta: '+err.message}}
})();
</script>

</html>
